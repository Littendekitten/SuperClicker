<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="SC.png">
    <title>SushiClicker</title>

    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
</head>
<body>

    <section id="loading-screen" class="screen">
        <p>Loading...</p>
    </section>

    <section id="login-screen" class="screen hidden">
        <h1>SushiClicker</h1>
        <p>Sign in to play</p>
        <button id="login-btn">Sign in with Google</button>
        <p id="login-error"></p>
    </section>

    <section id="menu-screen" class="screen hidden">
        <img src="SC.png" alt="SushiClicker logo" class="logo">
        <h1>Welcome To SushiClicker!</h1>
        <p id="login-status"></p>
        <button data-goto="game-screen">Start Game</button>
        <button id="logout-btn">Sign out</button>
    </section>

    <section id="game-screen" class="screen hidden">
        <h4>SushiClicker&copy;</h4>
        <h2>Points: <span id="score">0</span></h2>
        <button id="click-btn">Click Me!</button>
        <button data-goto="shop-screen">Shop</button>
        <button data-goto="menu-screen">Go Back</button>
    </section>

    <section id="shop-screen" class="screen hidden">
        <h4>SushiClicker&copy;</h4>
        <h2>Points: <span id="shop-score">0</span></h2>
        <h2>AutoClicker lvl <span id="auto-level">0</span></h2>
        <button id="buy-auto-btn">
            Buy AutoClicker (<span id="auto-cost">10</span> points)
        </button>
        <button data-goto="game-screen">Back to Game</button>
    </section>

</body>
</html>
